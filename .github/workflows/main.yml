name: Hourly SEC & ACC Weather and Live Radar Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-models-and-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib

      - name: Run Weather & Radar Ingestion
        run: |
          python run_hourly_ingest.py || true
          python generate_custom_radar.py || true

      - name: Commit and Push Changes
        run: |
          git config --global user.name "CFB-Weather-Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-update live weather and radar sweeps [skip ci]"
          git push origin main || true
